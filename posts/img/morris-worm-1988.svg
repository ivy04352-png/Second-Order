<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-label="Diagram: a known DEBUG backdoor left in sendmail for years gets used by the worm as one of three entry paths, then a reinfection bug turns a quiet spread into a network-wide crash.">
  <style>
    text { font-family: Georgia, 'Iowan Old Style', serif; fill: #1a1a1a; }
    .muted { fill: #5c5a55; font-size: 11px; }
    .label { font-size: 12px; }
  </style>

  <text x="320" y="18" text-anchor="middle" class="muted">known hole, years old &#8594; used quietly &#8594; a separate bug makes it loud</text>

  <rect x="20" y="50" width="150" height="55" rx="6" fill="#f7f5f0" stroke="#8a3324" stroke-width="2"/>
  <text x="95" y="75" text-anchor="middle" class="label">sendmail DEBUG</text>
  <text x="95" y="93" text-anchor="middle" class="muted">known since it was written</text>

  <path d="M170 77 H 250" stroke="#5c5a55" stroke-width="2" marker-end="url(#arrow4)"/>

  <rect x="255" y="50" width="140" height="55" rx="6" fill="#f7f5f0" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="325" y="75" text-anchor="middle" class="label">Morris worm</text>
  <text x="325" y="93" text-anchor="middle" class="muted">quiet infection</text>

  <path d="M395 77 H 475" stroke="#5c5a55" stroke-width="2" marker-end="url(#arrow4)"/>

  <rect x="480" y="50" width="140" height="55" rx="6" fill="#f7f5f0" stroke="#8a3324" stroke-width="2"/>
  <text x="550" y="72" text-anchor="middle" class="label">14% reinfect rule</text>
  <text x="550" y="90" text-anchor="middle" class="muted">machines choke on copies</text>

  <text x="320" y="140" class="muted" text-anchor="middle">~2,000 machines down, of ~60,000 on the early internet</text>
  <text x="320" y="160" class="muted" text-anchor="middle">same monoculture (BSD Unix) made one exploit work everywhere at once</text>

  <defs>
    <marker id="arrow4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5c5a55"/>
    </marker>
  </defs>
</svg>
