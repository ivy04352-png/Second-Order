<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-label="Diagram: one customer's ordinary config change hits a dormant bug and cascades across the shared network to unrelated sites.">
  <style>
    text { font-family: Georgia, 'Iowan Old Style', serif; fill: #1a1a1a; }
    .muted { fill: #5c5a55; font-size: 12px; }
    .label { font-size: 13px; }
  </style>
  <rect x="0" y="0" width="640" height="200" fill="none"/>

  <!-- customer -->
  <rect x="20" y="70" width="110" height="46" rx="6" fill="#f7f5f0" stroke="#8a3324" stroke-width="2"/>
  <text x="75" y="98" text-anchor="middle" class="label">1 customer</text>
  <text x="75" y="130" text-anchor="middle" class="muted">ordinary config change</text>

  <!-- arrow -->
  <path d="M135 93 H 205" stroke="#5c5a55" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- dormant bug -->
  <circle cx="245" cy="93" r="26" fill="none" stroke="#8a3324" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="245" y="98" text-anchor="middle" class="label">bug</text>
  <text x="245" y="140" text-anchor="middle" class="muted">dormant since May</text>

  <!-- arrow -->
  <path d="M275 93 H 330" stroke="#5c5a55" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- shared network -->
  <rect x="335" y="30" width="280" height="130" rx="8" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="475" y="20" text-anchor="middle" class="muted">shared network, 85% of traffic</text>

  <g class="label">
    <circle cx="380" cy="70" r="18" fill="#f7f5f0" stroke="#1a1a1a"/>
    <text x="380" y="75" text-anchor="middle" style="font-size:11px">Amazon</text>
    <circle cx="475" cy="55" r="18" fill="#f7f5f0" stroke="#1a1a1a"/>
    <text x="475" y="60" text-anchor="middle" style="font-size:11px">Reddit</text>
    <circle cx="565" cy="70" r="18" fill="#f7f5f0" stroke="#1a1a1a"/>
    <text x="565" y="75" text-anchor="middle" style="font-size:10px">NYT</text>
    <circle cx="420" cy="120" r="18" fill="#f7f5f0" stroke="#1a1a1a"/>
    <text x="420" y="125" text-anchor="middle" style="font-size:10px">Twitch</text>
    <circle cx="520" cy="125" r="18" fill="#f7f5f0" stroke="#1a1a1a"/>
    <text x="520" y="130" text-anchor="middle" style="font-size:10px">UK Gov</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5c5a55"/>
    </marker>
  </defs>
</svg>
