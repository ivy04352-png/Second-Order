<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-label="Diagram: a recovering switch's own recovery message trips the same bug in the next switch, and the fault propagates switch to switch across the network.">
  <style>
    text { font-family: Georgia, 'Iowan Old Style', serif; fill: #1a1a1a; }
    .muted { fill: #5c5a55; font-size: 11px; }
    .label { font-size: 12px; }
  </style>

  <text x="320" y="18" text-anchor="middle" class="muted">each switch recovers, announces "I'm back," and trips the next one</text>

  <!-- 5 switches in a row -->
  <g>
    <rect x="20" y="60" width="80" height="60" rx="6" fill="#f7f5f0" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="60" y="95" text-anchor="middle" class="label">switch 1</text>
    <text x="60" y="140" text-anchor="middle" class="muted">hiccup</text>

    <rect x="150" y="60" width="80" height="60" rx="6" fill="#f7f5f0" stroke="#8a3324" stroke-width="2"/>
    <text x="190" y="95" text-anchor="middle" class="label">switch 2</text>
    <text x="190" y="140" text-anchor="middle" class="muted">resets</text>

    <rect x="280" y="60" width="80" height="60" rx="6" fill="#f7f5f0" stroke="#8a3324" stroke-width="2"/>
    <text x="320" y="95" text-anchor="middle" class="label">switch 3</text>
    <text x="320" y="140" text-anchor="middle" class="muted">resets</text>

    <rect x="410" y="60" width="80" height="60" rx="6" fill="#f7f5f0" stroke="#8a3324" stroke-width="2"/>
    <text x="450" y="95" text-anchor="middle" class="label">switch 4</text>
    <text x="450" y="140" text-anchor="middle" class="muted">resets</text>

    <rect x="540" y="60" width="80" height="60" rx="6" fill="#f7f5f0" stroke="#8a3324" stroke-width="2"/>
    <text x="580" y="95" text-anchor="middle" class="label">switch 114</text>
    <text x="580" y="140" text-anchor="middle" class="muted">resets</text>
  </g>

  <path d="M100 90 H 150" stroke="#5c5a55" stroke-width="2" marker-end="url(#arrow2)"/>
  <path d="M230 90 H 280" stroke="#5c5a55" stroke-width="2" marker-end="url(#arrow2)"/>
  <path d="M360 90 H 410" stroke="#5c5a55" stroke-width="2" marker-end="url(#arrow2)"/>
  <path d="M490 90 H 540" stroke="#5c5a55" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow2)"/>

  <text x="320" y="200" text-anchor="middle" class="muted">the recovery signal is what spreads the fault, not a shared power line or cable</text>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5c5a55"/>
    </marker>
  </defs>
</svg>
